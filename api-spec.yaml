<!-- file: api-spec.yaml -->
# Protected API routes require an HS256 JWT in Authorization: Bearer <token>.
# Configure AUTH_TOKEN_SECRET with at least 32 private bytes in production. Without it, local
# non-production runs provide POST /api/v1/auth/demo, restricted to localhost, with a one-hour
# administrator token. Tokens contain sub, role, aud: "grain-api", iat, and exp. Role headers are ignored.
# POST /api/v1/registrations is the only unauthenticated API route and returns only its record ID/status.
openapi: 3.0.0
info:
title: Grain Distribution API
version: 1.0.0
paths:
/api/v1/transactions:
post:
summary: Create distribution attempt
parameters:
- name: Idempotency-Key
in: header
required: true
schema:
type: string
requestBody:
content:
application/json:
schema:
type: object
properties:
card_id: { type: string, format: uuid }
lot_id: { type: string, format: uuid }
quantity: { type: number }
responses:
'201':
description: Transaction created
'409':
description: State transition conflict
/api/v1/nodes/{node_id}/sync:
post:
summary: Sync offline batch
parameters:
- name: node_id
in: path
required: true
schema: { type: string, format: uuid }
requestBody:
content:
application/json:
schema:
type: object
properties:
batch_id: { type: string }
tokens: { type: array, items: { type: object } }
responses:
'200':
description: Batch processed